<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
<link rel="stylesheet" href="trabalho.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loja do Brasil</title>

    <style>

        body 
    </style>

</head>

<body>


 

    <header>

        <h2>🇧🇷 Brasil Store</h2>

        

        <div class="busca-container">

            <input type="text" placeholder="Buscar produtos do Brasil...">

            <button type="button">Buscar</button>

        </div>

        </div>

    </header>


 

    <div class="banner-container" id="banner">

        <img class="banner-imagem" src="https://www.shutterstock.com/image-vector/brazil-national-day-banner-brazilian-260nw-2328078603.jpg" alt="Banner Promocional">

    </div>


 

    <main class="vitrine">

        

        <div class="produto-card" id="produtos">

            <div class="produto-imagem-container">

                <img src="https://dasports.com.br/cdn/shop/files/camisa-brasil-i-2526-amarela-nike-masculino-jogador-4671436.jpg" alt="Camisa Oficial do Brasil">

            </div>

            <h3>Camisa Oficial do Brasil</h3>

            <p class="preco">R$59,90</p>

            <button class="btn-comprar">Adicionar ao Carrinho</button>

        </div>


 

        <div class="produto-card">

            <div class="produto-imagem-container">

                <img src="https://linhaconforto.fbitsstatic.net/img/p/chinelo-havaianas-brasil-logo-fc-amarelo-135715/505373-1.jpg" alt="Sandália Havaianas Brasil">

            </div>

            <h3>Sandália Havaianas Brasil</h3>

            <p class="preco">R$ 39,90</p>

            <button class="btn-comprar">Adicionar ao Carrinho</button>

        </div>


 

        <div class="produto-card">

            <div class="produto-imagem-container">

                <img src="https://bebercalcados.cdn.magazord.com.br/img/2025/06/produto/61286/45408645-1-4243.jpg" alt="Boné do Brasil">

            </div>

            <h3>Boné do Brasil</h3>

            <p class="preco">R$ 29,90</p>

            <button class="btn-comprar">Adicionar ao Carrinho</button>

        </div>


 

        <div class="produto-card">

            <div class="produto-imagem-container">

                <img src="https://images.tcdn.com.br/img/img_prod/695394/bandeira_do_brasil_oficial_estampada_dupla_face_0_90x1_28m_1093_3_adfb5cdc940d9f9778fd96a77e5d5613.jpg" alt="Bandeira do Brasil Oficial">

            </div> 
            <h4>Bandeira do Brasil</h4>
             <p class="preco">R$ 129,90</p>
              <button class="btn-comprar">Adicionar ao Carrinho</button>
        </div>
        
    </main>
    <div class="formulario">
      <input class="formulario-nome" placeholder="nome">

      <input class="formulario-email" placeholder="email">
         <button class="btn-comprar">enviar</button>
    </div>
